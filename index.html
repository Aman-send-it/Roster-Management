<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404.Creatives — Smart Roster Management</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>404.Creatives Roster System</h1>
      <p class="subtitle" id="app-subtitle">SQLite + HTML/JS · 4 Process Pods · 32 Employees · 20 Brands</p>
    </div>
    <div class="header-actions">
      <label class="inline-field" for="month-picker">
        <span>Month</span>
        <input type="month" id="month-picker" value="2026-12" />
      </label>
      <button type="button" id="btn-generate" class="btn btn-primary">Generate Roster</button>
      <button type="button" id="btn-export-db" class="btn btn-secondary">Export .db</button>
      <button type="button" id="btn-reset-db" class="btn btn-ghost">Reset DB</button>
    </div>
  </header>

  <div id="status-banner" class="status-banner status-ok" role="status" aria-live="polite">
    Loading 404.Creatives database...
  </div>

  <main class="container">
    <section id="kpi-container" class="kpi-grid" aria-label="Roster Summary"></section>

    <nav class="tabs" aria-label="Roster Views">
      <button type="button" class="tab-btn active" data-tab="roster">Monthly Roster Grid</button>
      <button type="button" class="tab-btn" data-tab="brands">Brands & Processes</button>
      <button type="button" class="tab-btn" data-tab="pods">Pods & Employees</button>
      <button type="button" class="tab-btn" data-tab="conflicts">Conflicts & Changes</button>
    </nav>

    <section id="roster-filters" class="filters-bar" aria-label="Filters"></section>

    <section id="view-container" aria-label="Active View"></section>
  </main>

  <script src="./js/db.js"></script>
  <script src="./js/engine.js"></script>
  <script src="./js/scheduler.js"></script>
  <script src="./js/views.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
